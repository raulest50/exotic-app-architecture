name: exotic-edge

# Shared HTTPS entry point plus existing SSH loopback listeners.
# Only files explicitly copied to EDGE_SITES_DIR with a .caddy extension are active.
services:
  edge:
    image: ${CADDY_IMAGE:-caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    restart: unless-stopped
    cpus: 0.08
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      VM_PUBLIC_IP: ${VM_PUBLIC_IP:?Define the public IPv4 address}
      STAGING_WEB_DOMAIN: ${STAGING_WEB_DOMAIN:?Define STAGING_WEB_DOMAIN}
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN:?Define STAGING_API_DOMAIN}
      PRODUCTION_WEB_DOMAIN: ${PRODUCTION_WEB_DOMAIN:?Define PRODUCTION_WEB_DOMAIN}
      PRODUCTION_API_DOMAIN: ${PRODUCTION_API_DOMAIN:?Define PRODUCTION_API_DOMAIN}
    ports:
      - target: 80
        published: "80"
        protocol: tcp
      - target: 443
        published: "443"
        protocol: tcp
      - target: 15173
        published: "15173"
        host_ip: "127.0.0.1"
        protocol: tcp
      - target: 18080
        published: "18080"
        host_ip: "127.0.0.1"
        protocol: tcp
      - target: 13000
        published: "13000"
        host_ip: "127.0.0.1"
        protocol: tcp
      - target: 18081
        published: "18081"
        host_ip: "127.0.0.1"
        protocol: tcp
    volumes:
      - type: bind
        source: ./config/edge.Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EDGE_SITES_DIR:?Define an absolute private EDGE_SITES_DIR on the VM}
        target: /etc/caddy/sites
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/edge.loopback.Caddyfile
        target: /etc/caddy/edge.loopback.Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    networks:
      - production_edge
      - staging_edge
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  production_edge:
    external: true
    name: exotic-production-edge
  staging_edge:
    external: true
    name: exotic-staging-edge

volumes:
  caddy_data:
    external: true
    name: exotic-edge-caddy-data
  caddy_config:
    external: true
    name: exotic-edge-caddy-config
