[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaphor-description-editor"
version = "0.1.0"
description = "Editor de Descripción y Nota independientes para Gaphor 3.3.2"
requires-python = ">=3.12"
dependencies = ["gaphor==3.3.2"]

[project.entry-points."gaphor.services"]
description_editor = "gaphor_description_editor:DescriptionEditor"

[project.entry-points."gaphor.modules"]
description_property_page = "gaphor_description_editor"

[tool.setuptools.packages.find]
include = ["gaphor_description_editor*"]
