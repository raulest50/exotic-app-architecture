[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaphor-folder-diagram"
version = "0.1.0"
description = "Importar/leer componente en crudo en Gaphor 3.3.2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["gaphor==3.3.2"]

[project.entry-points."gaphor.services"]
folder_diagram = "gaphor_folder_diagram:FolderDiagramService"

[tool.setuptools.packages.find]
include = ["gaphor_folder_diagram*"]
