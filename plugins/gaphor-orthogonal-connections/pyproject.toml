[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaphor-orthogonal-connections"
version = "0.1.0"
description = "Dependencias ortogonales con puntos de paso durante el arrastre"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["gaphor==3.3.2"]

[project.entry-points."gaphor.services"]
orthogonal_connections = "gaphor_orthogonal_connections:OrthogonalConnections"

[tool.setuptools.packages.find]
include = ["gaphor_orthogonal_connections*"]
