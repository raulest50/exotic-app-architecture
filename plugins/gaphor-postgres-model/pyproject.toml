[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaphor-postgres-model"
version = "0.1.0"
description = "Modelado relacional manual PostgreSQL para Gaphor 3.3.2"
requires-python = ">=3.12"
dependencies = ["gaphor==3.3.2"]

[project.entry-points."gaphor.modelinglanguages"]
PostgreSQL = "gaphor_postgres_model.language:PostgreSQLLanguage"

[project.entry-points."gaphor.services"]
postgres_model = "gaphor_postgres_model.service:PostgresService"

[project.entry-points."gaphor.modules"]
postgres_editor = "gaphor_postgres_model.service"

[tool.setuptools.packages.find]
include = ["gaphor_postgres_model*"]
